<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artikel - JB rent.id</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl px-4 mx-auto flex justify-between items-center h-16 sm:h-20">
            <a href="index.html" class="text-xl sm:text-2xl font-black text-emerald-600 tracking-wider">JB<span class="text-amber-500">rent.id</span></a>
            <nav class="hidden md:flex space-x-6 font-medium text-sm">
                <a href="index.html" class="text-slate-600 hover:text-emerald-600">Beranda</a>
                <a href="index.html#katalog" class="text-slate-600 hover:text-emerald-600">Katalog</a>
                <a href="artikel.html" class="text-emerald-600">Artikel</a>
            </nav>
        </div>
    </header>

    <main class="max-w-3xl mx-auto py-12 px-4">
        <div id="wrapper-artikel">
            <h2 id="judul-utama" class="text-4xl font-black mb-8 text-slate-900">Artikel Petualangan</h2>
            <div id="container-artikel" class="space-y-6"></div>
        </div>
    </main>

    <script>
        const artikel = [
            {judul: "Tips Mendaki Gunung untuk Pemula", isi: "Persiapkan fisik Anda minimal 2 minggu sebelum pendakian. Pastikan membawa logistik secukupnya dan selalu patuhi aturan pendakian setempat."},
            {judul: "Cara Merawat Tenda agar Awet", isi: "Setelah digunakan, bersihkan sisa tanah atau lumpur. Pastikan tenda benar-benar kering sebelum disimpan untuk mencegah jamur dan kerusakan pada material kain."}
        ];

        const container = document.getElementById('container-artikel');
        
        function tampilkanDaftar() {
            document.getElementById('judul-utama').innerText = "Artikel Petualangan";
            container.innerHTML = "";
            artikel.slice().reverse().forEach(art => {
                container.innerHTML += `
                <div class="p-8 bg-white rounded-3xl border border-slate-200 shadow-sm cursor-pointer hover:border-emerald-500 transition" 
                     onclick="bacaArtikel('${art.judul.replace(/'/g, "\\'")}', '${art.isi.replace(/'/g, "\\'")}')">
                    <h3 class="text-2xl font-bold text-emerald-700 mb-3">${art.judul}</h3>
                    <p class="text-slate-600 leading-relaxed">Klik untuk membaca selengkapnya...</p>
                </div>`;
            });
        }

        function bacaArtikel(judul, isi) {
            document.getElementById('judul-utama').innerText = judul;
            container.innerHTML = `
                <div class="p-8 bg-white rounded-3xl border border-slate-200">
                    <p class="text-slate-700 leading-relaxed text-lg">${isi}</p>
                    <button onclick="tampilkanDaftar()" class="mt-8 text-emerald-600 font-bold hover:underline">
                        <i class="fa-solid fa-arrow-left"></i> Kembali ke Daftar Artikel
                    </button>
                </div>`;
        }

        tampilkanDaftar();
    </script>
</body>
</html>
